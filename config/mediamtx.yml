###############################################
# MediaMTX Configuration - DRONE OPS
# Single stream key: "drone"
###############################################

logLevel: info
logDestinations:
  - stdout

# RTMP Server (port 1935)
rtmp: yes
rtmpAddress: :1935

# HLS Server (port 8888) - Low Latency HLS
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: lowLatency
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 60s

# Recording retention — keep videos 7 days (MediaMTX default is 24h!)
recordDeleteAfter: 168h

# WebRTC (port 8889)
webrtc: yes
webrtcAddress: :8889

# API (port 9997)
api: yes
apiAddress: :9997

# Paths
paths:
  drone:
    source: publisher
    record: yes
    recordPath: /var/lib/drone/videos/%Y-%m-%d/%Y-%m-%d_%H-%M-%S_%path
    recordFormat: fmp4
  all_others:
    source: publisher
    record: yes
    recordPath: /var/lib/drone/videos/%Y-%m-%d/%Y-%m-%d_%H-%M-%S_%path
    recordFormat: fmp4
