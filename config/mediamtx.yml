###############################################
# MediaMTX Configuration - DRONE OPS
# Single stream key: "drone"
###############################################

logLevel: info
logDestinations:
  - stdout

# RTMP Server (port 1935)
rtmp: yes
rtmpAddress: :1935

# HLS Server (port 8888)
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'

# WebRTC (port 8889)
webrtc: yes
webrtcAddress: :8889

# API (port 9997)
api: yes
apiAddress: :9997

# Paths
paths:
  drone:
    source: publisher
    record: yes
    recordPath: /var/lib/drone/videos/%Y-%m-%d/%Y-%m-%d_%H-%M-%S.flv
    recordFormat: flv
