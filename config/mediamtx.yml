#############################################
# MediaMTX Configuration for DRONE OPS
# https://github.com/bluenviron/mediamtx
# Optimized for Ubuntu 26 + DJI RTMP streams
#############################################

###############################################
# General settings
###############################################

logLevel: info
logDestinations:
  - stdout

###############################################
# RTMP Server
###############################################

rtmpAddress: :1935
rtmpEncryption: "no"
rtmpServerKey: ""
rtmpServerCert: ""

rtmpAllowPublishing:
  - all

rtmpAllowReading:
  - all

rtmpReadTimeout: 10s
rtmpWriteTimeout: 10s

###############################################
# RTSP Server (for compatibility)
###############################################

rtspAddress: :8554
protocols:
  - udp
  - tcp

rtspEncryption: "no"
rtspReadTimeout: 10s
rtspWriteTimeout: 10s

###############################################
# HLS Server (for web clients)
###############################################

hlsAddress: :8888
hlsAllowOrigin: '*'
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsReadTimeout: 10s

###############################################
# WebRTC Server (for web clients)
###############################################

webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcICEUDPMuxAddress: :8189
webrtcICETCPMuxAddress: :8189
webrtcReadTimeout: 10s

###############################################
# API Settings
###############################################

apiAddress: :9997
apiAllowOrigin: '*'

###############################################
# Path Settings
###############################################

paths:
  all_others:
    source: publisher
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    
    record: yes
    recordFormat: flv
    recordPath: /var/lib/drone/videos/%Y-%m-%d/%s.flv
    recordMaxDuration: 24h
    recordSegmentDuration: 1h
    recordCleanup: yes
    
    readTimeout: 10s
    writeTimeout: 10s

###############################################
# Limits & Performance
###############################################

# Maximum concurrent connections
maxConnections: 50

# Maximum connection per IP
maxConnectionsPerIP: 10

# Buffer size for RTMP
rtmpBufferCount: 32
