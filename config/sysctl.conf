# DRONE OPS RTMP Network Optimization
# Optimized for low-latency streaming on Ubuntu 26
# Apply with: sudo sysctl -p /etc/sysctl.d/99-drone-rtmp.conf

# Increase socket buffer sizes for RTMP throughput
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# TCP buffer tuning
net.ipv4.tcp_rmem = 8192 87380 26214400
net.ipv4.tcp_wmem = 8192 87380 26214400

# Use BBR congestion control for better streaming
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Increase connection queue
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 1024

# Reduce TCP timeouts for faster recovery
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# Allow more local ports for connections
net.ipv4.ip_local_port_range = 1024 65535

# Reduce latency
net.ipv4.tcp_low_latency = 1

# Faster connection establishment
net.ipv4.tcp_fastopen = 3

# Disable TCP slow start after idle
net.ipv4.tcp_slow_start_after_idle = 0
