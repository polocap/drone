# DRONE OPS WiFi AP — réseau TÉLÉCOMMANDE uniquement (flux drone)
# Ce réseau est réservé à la télécommande DJI qui publie le flux RTMP
# vers le Beelink. Les écrans/tablettes utilisent le WiFi du routeur 4G.
#
# NB: le script scripts/setup-wifi-ap.sh détecte automatiquement le
# support 5GHz de la carte et régénère ce fichier (repli 2.4GHz sinon).
interface=wlp2s0
driver=nl80211

ssid=corelink-001
country_code=FR
ieee80211d=1
hw_mode=a
channel=36
wmm_enabled=1

# 802.11n/ac (VHT80)
ieee80211n=1
ieee80211ac=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=9fK7qP2xL8vT4wR!3kD8mN5
